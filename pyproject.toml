[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Evidence-grounded, read-only incident investigation"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.33,<3", "pydantic>=2.10,<3", "streamlit>=1.66,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
